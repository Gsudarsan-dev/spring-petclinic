version: 0.2

phases:
  install:
    commands:
      - echo "Checking Java version..."
      - java -version

  pre_build:
    commands:
      - echo "Checking Maven version..."
      - ./mvnw -version

  build:
    commands:
      - echo "Building Spring PetClinic..."
      - ./mvnw clean package -Dtest='!PostgresIntegrationTests'

  post_build:
    commands:
      - echo "Build phase completed."

artifacts:
  files:
    - target/*.jar
    - appspec.yml
    - deploy/**/*
